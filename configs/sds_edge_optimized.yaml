# SDS-PAGE Edge-Optimized Configuration
# Addresses missing outer lanes (currently detecting 7/12 lanes)
#
# Key optimizations:
# 1. Enhanced edge lane detection for peripheral lanes
# 2. Improved lane boundary algorithms
# 3. Better handling of uneven illumination at gel edges
# 4. Optimized preprocessing for edge preservation

pre:
  invert_polarity: auto
  clip_percentiles: [1.0, 99.0]  # Preserve edge contrast
  normalize_intensity: true
  gaussian_sigma: 0.5  # Reduced from 0.0 - slight smoothing without edge loss
  background_removal_radius: 15.0  # Enable background removal for edge illumination
  enable_deskew: true  # Enable deskewing for better lane alignment
  deskew_angle_threshold: 1.0  # More tolerant threshold
  enable_debug_logging: true
  
  # Enhanced CLAHE for edge contrast
  clahe:
    enabled: true
    clip_limit: 2.5  # Moderate enhancement
    tile_grid: [4, 8]  # Horizontal emphasis for lane detection

detect:
  # Enhanced lane detection - more sensitive to edge lanes
  min_peak_distance_frac: 0.035  # Slightly reduced for closer lane detection
  prominence_frac: 0.045  # Slightly reduced for edge sensitivity
  rescue_enabled: true
  
  # Improved baseline handling for uneven illumination
  baseline:
    method: rolling_ball  # Better for uneven backgrounds
    window_frac: 0.025  # Larger window for smoother baseline
    window_px: 0
    clamp_min_px: 5  # Increased for stability
    clamp_max_px: 15  # Allow larger baseline variations
    quantile: 0.12  # Higher quantile for robust baseline

bands:
  # Standard band detection - working reasonably well
  min_distance_px: 12  # Keep current spacing
  min_peak_distance_frac: 0.015  # Slightly more sensitive
  prominence_frac: 0.025  # Slightly reduced for better sensitivity
  baseline:
    method: percentile  # Keep working method
    window_frac: 0.025
    window_px: 0
    clamp_min_px: 2
    clamp_max_px: 8
    quantile: 0.05
  min_peak_distance_px: 10

# Enhanced workflow for complete lane coverage
workflow:
  expected_lanes: 12  # Target full lane count
  sensitivity: 1.2  # Increased sensitivity beyond normal range
  constant_spacing: false  # Allow variable spacing for edge cases
  background_method: rolling_ball
  
  # Aggressive lane detection parameters
  min_peak_distance_frac: 0.035
  prominence_frac: 0.045
  rescue_enabled: true
  
  # Enhanced baseline for edge lane detection
  baseline:
    method: rolling_ball  # Better for uneven illumination
    window_frac: 0.025
    window_px: 0
    clamp_min_px: 5
    clamp_max_px: 15
    quantile: 0.12

# SDS-specific detection parameters
detection:
  min_width: 10  # Reduced minimum width for edge lanes
  prominence: 0.25  # Reduced for better edge detection
  expected_lanes: 12
  sensitivity: 1.2  # High sensitivity
  constant_spacing: false

# Enhanced lane boundary detection
lanes:
  min_peak_distance_frac: 0.02  # More sensitive boundary detection
  prominence_frac: 0.025  # Enhanced edge sensitivity

# Edge enhancement parameters
edge_enhancement:
  enabled: true
  method: gradient_magnitude
  sigma: 1.0
  threshold: 0.1