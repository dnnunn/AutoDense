# EtBr agarose parameters following 15-minute triage guide
pre:
  invert_polarity: auto   # true|false|auto
  clip_percentiles: [1.0, 99.0]
  normalize_intensity: true
  gaussian_sigma: 1.0
  background_removal_radius: 30.0  # rolling ball radius for gels
  enable_deskew: true
  deskew_angle_threshold: 0.5  # degrees
  enable_debug_logging: true
  clahe:
    enabled: false        # typically not needed for EtBr
    clip_limit: 2.0
    tile_grid: [8,8]

detect:
  prominence_frac: 0.10
  min_peak_distance_px: 10
  rescue_enabled: true

# Legacy parameters (for backward compatibility)
expected_lanes: 12
sensitivity: 0.4
constant_spacing: false
background_subtraction: true
peak_detection_method: "fluorescence"

