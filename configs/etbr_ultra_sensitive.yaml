# EtBr Fluorescence Detection - ULTRA SENSITIVE for Maximum Band Detection
# Created: 2025-01-07
# Purpose: Maximum sensitivity fluorescence detection - designed to catch all visible bands

pre:
  invert_polarity: false          # CRITICAL: Keep white bands on black background
  clip_percentiles: [0.1, 99.9]  # Preserve maximum dynamic range
  normalize_intensity: true
  gaussian_sigma: 0.5             # Minimal smoothing to preserve sharp edges
  background_removal_radius: 0.0  # No background subtraction
  enable_deskew: false
  deskew_angle_threshold: 0.5
  enable_debug_logging: true
  clahe:
    enabled: true                 # Enhance fluorescence contrast
    clip_limit: 5.0               # High clip limit for maximum enhancement
    tile_grid: [4,4]              # Larger tiles for global enhancement

detect:
  # MAXIMUM sensitivity parameters for fluorescence detection
  min_peak_distance_frac: 0.008   # Allow very close bands
  prominence_frac: 0.002          # ULTRA sensitive prominence threshold
  rescue_enabled: true
  
  baseline:
    method: "percentile"
    window_frac: 0.030            # Wider window for stable dark background
    window_px: 0
    clamp_min_px: 8
    clamp_max_px: 20
    quantile: 0.01                # Ultra-low quantile for dark background

bands:
  # ULTRA SENSITIVE for white fluorescent bands on black background
  min_distance_px: 2              # Allow extremely close bands
  min_peak_distance_frac: 0.003   # Maximum sensitivity
  prominence_frac: 0.001          # ULTRA sensitive prominence (1/10th of normal)
  
  baseline:
    method: "percentile"          # Best for fluorescence
    window_frac: 0.025            # Wide window for dark background stability
    window_px: 0
    clamp_min_px: 5
    clamp_max_px: 15
    quantile: 0.01                # Ultra-low quantile for black background

# Execution parameters - maximize detection
workflow:
  expected_lanes: 20              # Allow many lanes
  sensitivity: 0.99               # Maximum sensitivity
  constant_spacing: false         # Allow irregular spacing
  
# Legacy compatibility
expected_lanes: 20
sensitivity: 0.99
constant_spacing: false
background_subtraction: false      # Preserve fluorescent signal
peak_detection_method: "fluorescence"

# ULTRA-SENSITIVE RATIONALE:
# 1. prominence_frac: 0.001 (vs normal 0.02) = 20x more sensitive
# 2. min_distance_px: 2 (vs normal 8) = detect very close bands  
# 3. quantile: 0.01 (vs normal 0.05) = better dark background baseline
# 4. Wide baseline windows = more stable background calculation
# 5. Maximum CLAHE enhancement for fluorescence visibility
# 6. Minimal Gaussian blur = preserve sharp fluorescent edges