# EtBr agarose parameters following 15-minute triage guide
pre:
  invert_polarity: auto   # true|false|auto
  clip_percentiles: [1.0, 99.0]
  normalize_intensity: true
  gaussian_sigma: 1.0
  background_removal_radius: 0.0  # TESTING: disabled to avoid halos
  enable_deskew: false  # DISABLED to test if this causes skewing
  deskew_angle_threshold: 0.5  # degrees
  enable_debug_logging: true
  clahe:
    enabled: true         # VISION ENGINEER: Enable contrast enhancement
    clip_limit: 2.0
    tile_grid: [8,8]

detect:
  # AUDITOR'S SAFE BASELINE SYSTEM: EtBr-specific config
  min_peak_distance_frac: 0.028     # relaxed for more lanes (was 0.035)
  prominence_frac: 0.045             # relaxed for more lanes (was 0.06)
  rescue_enabled: true
  
  baseline:
    method: "percentile"            # gentle baseline for fluorescent bands
    window_frac: 0.015              # 1.5% of ROI width (slightly less than SDS)
    window_px: 0                    # 0 = use fraction
    clamp_min_px: 3                 # same safe bounds as SDS
    clamp_max_px: 10                # slightly smaller max for EtBr
    quantile: 0.08                  # lower quantile for fluorescent baseline

bands:
  # ENHANCED: Band detection parameters for EtBr gels - VISION ENGINEER RECOMMENDATIONS
  min_distance_px: 8               # VISION ENGINEER: Allow closer bands (was 12)
  min_peak_distance_frac: 0.02     # More sensitive fallback
  prominence_frac: 0.015           # VISION ENGINEER: Ultra-sensitive (was 0.03)
  
  baseline:
    method: "morph"                 # VISION ENGINEER: Better for fluorescence (was percentile)
    window_frac: 0.008              # Tighter window to prevent profile zeroing
    window_px: 0                    # 0 = use fraction; else explicit px
    clamp_min_px: 2                 # Hard minimum bound for bands
    clamp_max_px: 4                 # Tighter maximum bound for precision
    quantile: 0.08                  # More sensitive baseline

# Legacy parameters (for backward compatibility)
expected_lanes: 12
sensitivity: 0.4
constant_spacing: false
background_subtraction: false  # FIXED: Disable to avoid multiple background removal
peak_detection_method: "fluorescence"

# SCHEMA UNIFIED: Execution parameters for optimization system
# This solves parameter isolation - both optimization and execution now read from workflow:
workflow:
  # EtBr-specific execution parameters
  expected_lanes: 20              # EtBr gels typically have more lanes
  sensitivity: 0.8                # Good sensitivity for fluorescent bands  
  constant_spacing: false         # EtBr gels often have irregular spacing
  background_method: "rolling_ball"
  
  # Detection algorithm parameters (can be optimized)
  min_peak_distance_frac: 0.028   # relaxed for more lanes (was 0.035)
  prominence_frac: 0.045          # relaxed for more lanes (was 0.06)
  rescue_enabled: true
  
  # Baseline parameters (EtBr-specific)
  baseline:
    method: "percentile"          # Good for fluorescent baseline
    window_frac: 0.015            # Tighter for EtBr fluorescence
    window_px: 0
    clamp_min_px: 3
    clamp_max_px: 12
    quantile: 0.08                # Lower quantile for fluorescent baseline

# EtBr-specific detection parameters (LEGACY - for backward compatibility)
etbr_detection:
  expected_lanes: 20              # EtBr gels typically have more lanes
  sensitivity: 0.8                # Good sensitivity for fluorescent bands  
  constant_spacing: false         # EtBr gels often have irregular spacing
  background_subtraction: false   # Disable to avoid multiple background removal
  peak_detection_method: "fluorescence"  # EtBr-specific detection method

