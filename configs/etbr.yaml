# EtBr agarose parameters following 15-minute triage guide
pre:
  invert_polarity: auto   # true|false|auto
  clip_percentiles: [1.0, 99.0]
  normalize_intensity: true
  gaussian_sigma: 1.0
  background_removal_radius: 0.0  # TESTING: disabled to avoid halos
  enable_deskew: false  # DISABLED to test if this causes skewing
  deskew_angle_threshold: 0.5  # degrees
  enable_debug_logging: true
  clahe:
    enabled: false        # typically not needed for EtBr
    clip_limit: 2.0
    tile_grid: [8,8]

detect:
  # AUDITOR'S SAFE BASELINE SYSTEM: EtBr-specific config
  min_peak_distance_frac: 0.035     # slightly tighter spacing for EtBr vs SDS
  prominence_frac: 0.06              # lenient for fluorescent bands (was 0.10)
  rescue_enabled: true
  
  baseline:
    method: "percentile"            # gentle baseline for fluorescent bands
    window_frac: 0.015              # 1.5% of ROI width (slightly less than SDS)
    window_px: 0                    # 0 = use fraction
    clamp_min_px: 3                 # same safe bounds as SDS
    clamp_max_px: 10                # slightly smaller max for EtBr
    quantile: 0.08                  # lower quantile for fluorescent baseline

bands:
  baseline:
    method: "percentile"            # gentle baseline for EtBr band detection
    window_frac: 0.012              # 1.2% of ROI width for band detection (tighter than lane)
    window_px: 0                    # 0 = use fraction; else explicit px
    clamp_min_px: 2                 # Hard minimum bound for bands
    clamp_max_px: 6                 # Hard maximum bound for bands (tighter for fluorescent)
    quantile: 0.06                  # 6th percentile for fluorescent band baseline

# Legacy parameters (for backward compatibility)
expected_lanes: 12
sensitivity: 0.4
constant_spacing: false
background_subtraction: false  # FIXED: Disable to avoid multiple background removal
peak_detection_method: "fluorescence"

