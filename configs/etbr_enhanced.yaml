# EtBr Enhanced Configuration - Ultra-Sensitive Band Detection
# TARGET: 2 bands → 15+ bands (750% improvement)
# Based on Vision Engineer recommendations for catastrophic failure recovery

# Ultra-sensitive preprocessing for fluorescence enhancement
pre:
  invert_polarity: auto
  clip_percentiles: [1.0, 99.0]
  normalize_intensity: true
  gaussian_sigma: 1.0
  background_removal_radius: 0.0  # Keep disabled to avoid halos
  enable_deskew: false
  deskew_angle_threshold: 0.5
  enable_debug_logging: true
  
  # ENHANCED: Enable CLAHE for contrast enhancement of fluorescent bands
  clahe:
    enabled: true           # VISION ENGINEER RECOMMENDATION
    clip_limit: 2.0
    tile_grid: [8,8]

# Ultra-sensitive lane detection parameters
detect:
  min_peak_distance_frac: 0.025   # More sensitive than baseline 0.028
  prominence_frac: 0.035           # Reduced from 0.045 for higher sensitivity
  rescue_enabled: true
  
  baseline:
    method: "percentile"          # Gentle baseline for fluorescent bands
    window_frac: 0.012            # Tighter window for precision
    window_px: 0
    clamp_min_px: 3
    clamp_max_px: 10
    quantile: 0.06               # Lower quantile for sensitive detection

# ULTRA-SENSITIVE: Band detection parameters
bands:
  min_distance_px: 8             # VISION ENGINEER: Allow closer bands (was 12)
  min_peak_distance_frac: 0.015  # Ultra-sensitive fallback
  prominence_frac: 0.01          # EXTREME: Even more sensitive than 0.015
  
  baseline:
    method: "morph"              # VISION ENGINEER: Better for fluorescence
    window_frac: 0.005           # Even tighter window to prevent profile zeroing
    window_px: 0
    clamp_min_px: 2
    clamp_max_px: 4              # Very tight for precision
    quantile: 0.03               # Ultra sensitive quantile

# Legacy parameters (backward compatibility) - ENHANCED
expected_lanes: 12
sensitivity: 1.2                 # Much higher sensitivity
constant_spacing: false
background_subtraction: false
peak_detection_method: "fluorescence"

# DIRECT BAND PARAMETERS (for systems that don't read bands section)
min_distance_px: 8               # VISION ENGINEER: Allow closer bands
prominence_frac: 0.01            # Ultra-sensitive for catastrophic failure recovery
band_prominence_frac: 0.01       # Alternative parameter name
band_min_distance_px: 8          # Alternative parameter name

# Workflow parameters for optimization system - ULTRA-SENSITIVE
workflow:
  expected_lanes: 20
  sensitivity: 1.5               # Maximum sensitivity
  constant_spacing: false
  background_method: "rolling_ball"
  
  # ULTRA-SENSITIVE detection algorithm parameters
  min_peak_distance_frac: 0.015  # Even tighter
  prominence_frac: 0.01          # Ultra-sensitive for catastrophic recovery
  rescue_enabled: true
  
  # Band-specific parameters in workflow
  band_prominence_frac: 0.01
  band_min_distance_px: 8
  
  # Enhanced baseline parameters
  baseline:
    method: "morph"              # Better morphological baseline
    window_frac: 0.008           # Tighter window
    window_px: 0
    clamp_min_px: 2
    clamp_max_px: 6
    quantile: 0.03               # More sensitive

# EtBr-specific enhanced detection - ULTRA-SENSITIVE
etbr_detection:
  expected_lanes: 20
  sensitivity: 1.5               # Maximum sensitivity
  constant_spacing: false
  background_subtraction: false
  peak_detection_method: "fluorescence"
  # Band detection parameters directly in etbr_detection
  min_distance_px: 8
  prominence_frac: 0.01
  band_prominence_frac: 0.01
  baseline_method: "morph"