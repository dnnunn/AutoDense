# EtBr agarose parameters - POLARITY CORRECTED for fluorescence detection
# CRITICAL FIX: Don't invert polarity - keep white bands on black background for proper detection

pre:
  invert_polarity: false          # CRITICAL FIX: Don't invert (was "auto")
  clip_percentiles: [1.0, 99.0]
  normalize_intensity: true
  gaussian_sigma: 1.0
  background_removal_radius: 0.0
  enable_deskew: false
  deskew_angle_threshold: 0.5
  enable_debug_logging: true
  clahe:
    enabled: true                 # Keep contrast enhancement
    clip_limit: 3.0               # Boost for dark fluorescence
    tile_grid: [8,8]

detect:
  # Enhanced parameters for fluorescence detection (white bands on black)
  min_peak_distance_frac: 0.025   # Slightly relaxed
  prominence_frac: 0.035          # More sensitive for fluorescence peaks
  rescue_enabled: true
  
  baseline:
    method: "percentile"
    window_frac: 0.012            # Tighter window for dark background
    window_px: 0
    clamp_min_px: 3
    clamp_max_px: 8
    quantile: 0.05                # Lower quantile for dark background

bands:
  # Optimized for WHITE bands on BLACK background (fluorescence)
  min_distance_px: 6              # Allow closer bands
  min_peak_distance_frac: 0.015   # More sensitive
  prominence_frac: 0.02           # Sensitive to fluorescent peaks
  
  baseline:
    method: "percentile"          # Better for fluorescence than morph
    window_frac: 0.006            # Very tight window for dark background
    window_px: 0
    clamp_min_px: 2
    clamp_max_px: 4
    quantile: 0.05                # Low quantile for dark background

# Execution parameters
workflow:
  expected_lanes: 20
  sensitivity: 0.9                # High sensitivity for fluorescence
  constant_spacing: false
  
# Legacy compatibility
expected_lanes: 20
sensitivity: 0.9
constant_spacing: false
background_subtraction: false
peak_detection_method: "fluorescence"