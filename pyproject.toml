[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autodense"
version = "0.2.0"
description = "Python-native gel and colony analysis suite for laboratory image quantification"
authors = [{name="Better Dairy R&D"}]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    # Core scientific stack
    "numpy>=1.21.0",
    "scipy>=1.7.0", 
    "scikit-image>=0.19.0",
    "pillow>=8.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    
    # Image I/O and processing
    "tifffile>=2021.7.2",
    "imageio>=2.9.0",
    
    # Web UI
    "streamlit>=1.20.0",
    
    # Optional optimization/coaching API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    
    # Testing
    "pytest>=7.0.0",
]

[project.scripts]
autodense-ui = "ui.streamlit_app:main"
autodense-batch = "scripts.batch_infer:main"

[project.optional-dependencies]
dev = [
    "black>=22.0.0",
    "ruff>=0.1.0", 
    "pytest>=7.0.0",
]
all = [
    "autodense[dev]",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
select = ["E", "F", "I"]
ignore = ["E501"]  # let black handle line length