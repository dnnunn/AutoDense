<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoDense - Laboratory Image Analysis</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f7;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
        }
        
        h1 {
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: #86868b;
            margin-bottom: 32px;
        }
        
        .canvas-wrap {
            position: relative;
            display: inline-block;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            overflow: hidden;
            margin: 20px 0;
            background: white;
        }
        
        #base {
            display: block;
            max-width: 100%;
            height: auto;
        }
        
        #overlay {
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: none;
            opacity: 0.85;
        }
        
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .btn {
            background: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }
        
        .btn:hover {
            background: #0056CC;
        }
        
        .btn:disabled {
            background: #d1d1d6;
            cursor: not-allowed;
        }
        
        .status {
            padding: 12px 16px;
            border-radius: 6px;
            margin: 16px 0;
            font-size: 14px;
        }
        
        .status.info {
            background: #e7f3ff;
            color: #0066cc;
            border: 1px solid #b3d9ff;
        }
        
        .status.success {
            background: #f0fff0;
            color: #008000;
            border: 1px solid #90ee90;
        }
        
        .status.error {
            background: #fff5f5;
            color: #cc0000;
            border: 1px solid #ffb3b3;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #d1d1d6;
            border-radius: 50%;
            border-top-color: #007AFF;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AutoDense</h1>
        <p class="subtitle">Laboratory Image Analysis with AI-Powered Control</p>
        
        <div id="status" class="status info">
            <span class="loading"></span>
            Initializing analysis system...
        </div>
        
        <div class="canvas-wrap" id="canvas-container" style="display: none;">
            <img id="base" src="/images/current" style="display:block; max-width:100%;">
            <img id="overlay" src="/overlays/current.png"
                 style="position:absolute; left:0; top:0; pointer-events:none;">
        </div>
        
        <div class="controls">
            <button class="btn" onclick="loadTestImage()">Load Test Image</button>
            <button class="btn" onclick="detectLanes()">Detect Lanes</button>
            <button class="btn" onclick="detectBands()">Detect Bands</button>
            <button class="btn" onclick="quantifyBands()">Quantify Bands</button>
            <button class="btn" onclick="exportResults()">Export Results</button>
        </div>
    </div>

    <script type="module">
        const base = document.getElementById('base');
        const overlay = document.getElementById('overlay');
        const canvasContainer = document.getElementById('canvas-container');
        const statusEl = document.getElementById('status');

        function syncOverlaySize() {
            // Keep overlay pixel-for-pixel with the rendered base
            overlay.style.width  = base.clientWidth + 'px';
            overlay.style.height = base.clientHeight + 'px';
        }

        // Reflow guards
        base.addEventListener('load', syncOverlaySize);
        window.addEventListener('resize', syncOverlaySize);

        // Called by ui.refresh_canvas() responses
        window.refreshOverlay = function(url) {
            overlay.src = `${url}?t=${Date.now()}`;
            // In case the base image reflowed
            requestAnimationFrame(syncOverlaySize);
        };

        // Status management
        window.updateStatus = function(message, type = 'info', showLoading = false) {
            statusEl.className = `status ${type}`;
            statusEl.innerHTML = showLoading ? 
                `<span class="loading"></span>${message}` : 
                message;
        };

        // Initialize
        window.updateStatus('Ready for analysis', 'success');
        
        // Show canvas when image is loaded
        base.addEventListener('load', function() {
            canvasContainer.style.display = 'inline-block';
            syncOverlaySize();
        });

        // API integration functions
        window.loadTestImage = async function() {
            window.updateStatus('Loading test image...', 'info', true);
            try {
                const response = await fetch('/api/load-test-image', { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    base.src = `/images/current?t=${Date.now()}`;
                    window.updateStatus('Test image loaded successfully', 'success');
                } else {
                    throw new Error(result.message || 'Failed to load test image');
                }
            } catch (error) {
                window.updateStatus(`Error: ${error.message}`, 'error');
            }
        };

        window.detectLanes = async function() {
            window.updateStatus('Detecting lanes...', 'info', true);
            try {
                const response = await fetch('/api/detect-lanes', { method: 'POST' });
                const result = await response.json();
                if (result.success && result.overlay_png) {
                    window.refreshOverlay(result.overlay_png);
                    window.updateStatus(`Detected ${result.lanes_found || 0} lanes`, 'success');
                } else {
                    throw new Error(result.message || 'Failed to detect lanes');
                }
            } catch (error) {
                window.updateStatus(`Error: ${error.message}`, 'error');
            }
        };

        window.detectBands = async function() {
            window.updateStatus('Detecting bands...', 'info', true);
            try {
                const response = await fetch('/api/detect-bands', { method: 'POST' });
                const result = await response.json();
                if (result.success && result.overlay_png) {
                    window.refreshOverlay(result.overlay_png);
                    window.updateStatus(`Detected ${result.bands_total || 0} bands`, 'success');
                } else {
                    throw new Error(result.message || 'Failed to detect bands');
                }
            } catch (error) {
                window.updateStatus(`Error: ${error.message}`, 'error');
            }
        };

        window.quantifyBands = async function() {
            window.updateStatus('Quantifying bands...', 'info', true);
            try {
                const response = await fetch('/api/quantify-bands', { method: 'POST' });
                const result = await response.json();
                if (result.success && result.overlay_png) {
                    window.refreshOverlay(result.overlay_png);
                    window.updateStatus(`Quantified bands in ${result.lanes_quantified || 0} lanes`, 'success');
                } else {
                    throw new Error(result.message || 'Failed to quantify bands');
                }
            } catch (error) {
                window.updateStatus(`Error: ${error.message}`, 'error');
            }
        };

        window.exportResults = async function() {
            window.updateStatus('Exporting results...', 'info', true);
            try {
                const response = await fetch('/api/export-results', { method: 'POST' });
                const result = await response.json();
                if (result.success) {
                    window.updateStatus('Results exported successfully', 'success');
                    // Download the file if provided
                    if (result.download_url) {
                        const link = document.createElement('a');
                        link.href = result.download_url;
                        link.download = result.filename || 'results.csv';
                        link.click();
                    }
                } else {
                    throw new Error(result.message || 'Failed to export results');
                }
            } catch (error) {
                window.updateStatus(`Error: ${error.message}`, 'error');
            }
        };
    </script>
</body>
</html>
