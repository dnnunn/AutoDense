[server]
# Fix for browse button issues
enableCORS = false
enableXsrfProtection = false
headless = true

[browser]
# Browser settings to improve file upload compatibility
gatherUsageStats = false
serverAddress = "localhost"

[theme]
# Clean theme for better component rendering
primaryColor = "#ff4b4b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"

[logger]
# Reduce log noise
level = "warning"

[client]
# Client-side optimizations
showErrorDetails = true
toolbarMode = "minimal"

[ui]
hideTopBar = true