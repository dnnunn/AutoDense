task: colony_count
qc:
  touching_fraction_max: 0.20
  size_cv_max: 0.30
  min_colony_count: 10
  max_colony_count: 2000
acceptance:
  must_improve: ["effective_recall"]
  must_not_regress: ["touching_fraction","size_cv","false_positive_rate"]
budget:
  max_attempts: 4
runner:
  run_cmd: "python -m autodense_autotune.java_bridge colony_count --input {input} --config configs/colony.yaml --outdir {outdir}"
search:
  param_grids:
    # SCHEMA UNIFIED: Now targets workflow: section for consistent optimization/execution
    # This solves the parameter isolation issue where optimization modified detect: but execution read colony_detection:
    - file: "configs/colony.yaml"
      path: "workflow.baseline.method"
      values: ["none", "none", "percentile"]  # 2/3 chance baseline disabled
    - file: "configs/colony.yaml"
      path: "workflow.baseline.window_frac"
      values: [0.005, 0.01, 0.015]  # Very gentle if enabled (0.5-1.5%)
    - file: "configs/colony.yaml"
      path: "workflow.prominence_frac"
      values: [0.06, 0.08, 0.10]
    - file: "configs/colony.yaml"
      path: "workflow.min_peak_distance_frac"
      values: [0.04, 0.05, 0.06]  # Larger spacing for colonies
    - file: "configs/colony.yaml"
      path: "workflow.stain"
      values: ["none", "x-gal"]  # Now can optimize colony-specific execution parameters!
    - file: "configs/colony.yaml"
      path: "workflow.min_size"
      values: [3.0, 5.0, 8.0]  # Optimize size filtering
    - file: "configs/colony.yaml"
      path: "workflow.max_size"
      values: [800.0, 1000.0, 1200.0]  # Optimize max size bounds
    # Legacy segmentation parameters (still needed for colony detection)
    - file: "configs/colony.yaml"
      path: "segmentation.threshold"
      values: [0.25, 0.30, 0.35]
