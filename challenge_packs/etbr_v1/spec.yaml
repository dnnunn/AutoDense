task: etbr_agarose
qc:
  lane_count_tolerance: 1
  ladder_linear_r2_min: 0.995
  background_snr_min: 5.0
  smearing_index_max: 0.35
acceptance:
  must_improve: ["ladder_linear_r2","background_snr"]
  must_not_regress: ["smearing_index"]
budget:
  max_attempts: 4
runner:
  run_cmd: "python -m autodense_autotune.java_bridge etbr_agarose --input {input} --config configs/etbr.yaml --outdir {outdir}"
search:
  param_grids:
    # AUDITOR'S SAFE PARAMETER GRIDS: EtBr-specific safe baseline exploration
    - file: "configs/etbr.yaml"
      path: "detect.baseline.method"
      values: ["percentile", "morph", "none"]
    - file: "configs/etbr.yaml"
      path: "detect.baseline.window_frac"
      values: [0.01, 0.015, 0.02]  # Tighter range for EtBr fluorescence
    - file: "configs/etbr.yaml"
      path: "detect.baseline.quantile"
      values: [0.05, 0.08, 0.12]   # Lower quantiles for fluorescent baseline
    - file: "configs/etbr.yaml"
      path: "detect.prominence_frac"
      values: [0.04, 0.06, 0.08]
    - file: "configs/etbr.yaml"
      path: "detect.min_peak_distance_frac"
      values: [0.03, 0.035, 0.04]  # Tighter spacing for EtBr bands
