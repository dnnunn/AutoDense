name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('autodense/plugin/pom.xml') }}
          restore-keys: maven-

      - name: Verify Java environment
        run: |
          java -version
          mvn -version

      - name: Compile and package
        run: |
          cd autodense/plugin
          mvn -B -q clean compile package -DskipTests=true

      - name: Verify build artifacts
        run: |
          cd autodense/plugin
          ls -la target/
          echo "✓ Build completed successfully"
          if [ -f target/autodense-plugin-0.1.0-SNAPSHOT.jar ]; then
            echo "✓ Plugin JAR created: $(ls -lh target/autodense-plugin-0.1.0-SNAPSHOT.jar)"
          else
            echo "❌ Plugin JAR not found"
            exit 1
          fi